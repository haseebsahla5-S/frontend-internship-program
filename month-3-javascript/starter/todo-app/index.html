<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>To-do</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <main class="app">
    <h1>To-do</h1>

    <form id="todo-form" class="todo-form">
      <label for="todo-input" class="visually-hidden">New task</label>
      <input id="todo-input" name="title" placeholder="What needs doing?" autocomplete="off" required>
      <button type="submit">Add</button>
    </form>

    <div class="filters" role="group" aria-label="Filter tasks">
      <button type="button" data-filter="all" aria-pressed="true">All</button>
      <button type="button" data-filter="active" aria-pressed="false">Active</button>
      <button type="button" data-filter="done" aria-pressed="false">Done</button>
    </div>

    <ul id="todo-list" class="todo-list"></ul>
    <p id="todo-count" class="todo-count" aria-live="polite"></p>
  </main>
</body>
</html>
